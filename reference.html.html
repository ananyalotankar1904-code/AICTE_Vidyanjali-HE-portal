    function details(){const a=app(state.selected)||state.apps[0];const next=a.deficiency?'Institution to submit corrected documents':a.stage===5?'Institution to review final outcome':a.stage===3?'EVC committee to submit inspection report':a.stage===4?'Executive committee to record decision':'Assigned officer to review application';return `<button class="back button ghost" data-page="applications">${icon('left',15)} Back to applications</button>${head(a.id,escapeHTML(a.name),`${escapeHTML(a.city)} · ${escapeHTML(a.type)}`,`<button class="button danger" data-modal="deficiency" ${a.stage===5?'disabled':''}>Return for deficiency</button><button class="button" data-modal="advance" ${a.deficiency||a.stage===5?'disabled':''}>Move to next stage ${icon('chevron',15)}</button>`)}<div class="detail-grid"><div class="detail-left"><section class="card card-pad"><div class="section-title"><div><h2>Approval progress</h2><p class="muted">The case is currently at ${stages[a.stage]}</p></div>${badge(a.status)}</div><div class="stepper" aria-label="Application progress">${stages.map((s,i)=>`<div class="step ${i<a.stage?'done':i===a.stage?'current':''}" aria-label="${s}: ${i<a.stage?'completed':i===a.stage?'current':'upcoming'}">${s}</div>`).join('')}</div></section><section class="card card-pad"><div class="section-title"><h2>What happens next</h2></div><div class="flow-callout"><div><strong>${escapeHTML(next)}</strong><p>Current owner: ${escapeHTML(a.owner)} · Target date: ${fmt(a.deadline)}</p></div>${icon('chevron',16)}</div><div class="summary-row"><div><span>Application</span><b class="mono">${a.id}</b></div><div><span>Type</span><b>${escapeHTML(a.type)}</b></div><div><span>Ageing</span><b>${a.age} days</b></div></div></section><section class="card card-pad"><div class="section-title"><div><h2>Deficiency review</h2><p class="muted">Items that could delay approval</p></div></div>${a.deficiency?`<div class="attention urgent"><h3>Action required from institution</h3><p>${escapeHTML(a.deficiency)}</p></div>`:`<div class="attention"><h3>No open deficiency</h3><p>The current review has no unresolved deficiency recorded.</p></div>`}</section><section class="card card-pad"><div class="section-title"><div><h2>Document checklist</h2><p class="muted">Required evidence for this application</p></div></div><div class="checklist">${a.documents.map(d=>{const item=state.docs.find(x=>x.institution===a.name&&x.name===d);const missing=item&&['Missing','Expired'].includes(item.status);return `<div class="check"><div class="left"><span class="tick ${missing?'missing':''}">${missing?'!':'✓'}</span><span>${escapeHTML(d)}</span></div>${item?badge(item.status):badge('Valid')}</div>`}).join('')}</div><button class="button ghost" data-page="compliance" style="margin-top:12px">Open document inventory ${icon('chevron',14)}</button></section></div><div class="detail-right"><section class="card card-pad"><div class="section-title"><h2>Deadline</h2>${icon('clock',18)}</div><p class="muted small">Next response or review due</p><p style="font-size:25px;font-weight:700;margin:5px 0">${fmt(a.deadline)}</p><p class="small muted">Escalate if the assigned owner cannot act before this date.</p><button class="button secondary" data-modal="reminder" style="margin-top:16px">Send reminder</button></section><section class="card card-pad"><div class="section-title"><h2>Activity & audit</h2><button class="button ghost" data-page="audit">Full history</button></div>${activity(state.audit.filter(e=>e.app===a.id).slice(0,4))||'<p class="muted small">No activity yet.</p>'}</section></div></div>`}
    function evc(){const list=state.evcs;return `${head('Inspection coordination','EVC management','Plan visits, assign members, track evidence, and confirm completion.',`<div class="segment" role="group" aria-label="Inspection view"><button data-evc-view="List" class="${state.evcView==='List'?'selected':''}" aria-pressed="${state.evcView==='List'}">List</button><button data-evc-view="Calendar" class="${state.evcView==='Calendar'?'selected':''}" aria-pressed="${state.evcView==='Calendar'}">Calendar</button></div>`)}${state.evcView==='List'?`<section class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Inspection</th><th>Institution</th><th>Committee members</th><th>Scheduled</th><th>Mode</th><th>Status</th><th>Evidence</th><th>Actions</th></tr></thead><tbody>${list.map(e=>`<tr><td class="mono">${e.id}</td><td><button class="link-row" data-open-app="${e.app}">${escapeHTML(app(e.app)?.name)}</button></td><td>${escapeHTML(e.members)}</td><td class="nowrap">${fmt(e.date)}</td><td>${e.mode}</td><td>${badge(e.status)}</td><td>${e.evidence==='Not uploaded'?'<span class="muted">Not uploaded</span>':`<button class="button ghost" data-modal="evidence" data-id="${e.id}">View report</button>`}</td><td><button class="icon-button" data-modal="evc-actions" data-id="${e.id}" aria-label="Actions for ${e.id}">${icon('more',18)}</button></td></tr>`).join('')}</tbody></table></div></section>`:`<section class="card card-pad"><div class="section-title"><h2>November 2026</h2><span class="muted small">Select an inspection for actions</span></div><div class="calendar">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>`<div class="weekday">${x}</div>`).join('')}${Array.from({length:35},(_,i)=>{const n=i+1;return n>30?'<div class="cal-day blank"></div>':`<div class="cal-day"><b>${n}</b>${list.filter(e=>e.date===`2026-11-${String(n).padStart(2,'0')}`).map(e=>`<button class="cal-event" data-modal="evc-actions" data-id="${e.id}">${escapeHTML(app(e.app)?.name||e.id)}</button>`).join('')}</div>`}).join('')}</div></section>`}<div class="split-lower" style="margin-top:18px"><section class="card card-pad"><div class="section-title"><h2>Upcoming inspection</h2></div><p class="strong">Chennai Technical University</p><p class="small muted">7 Nov 2026 · On-site · Dr Meera Shah and Prof. S. Iyer</p><button class="button secondary" data-modal="evc-actions" data-id="EVC-301" style="margin-top:15px">Manage inspection</button></section><section class="card card-pad"><div class="section-title"><h2>Completion status</h2></div><p class="strong">${list.filter(e=>e.status==='Completed').length} of ${list.length} inspections completed</p><p class="small muted">Evidence remains attached to each inspection record.</p></section></div>`}
    function compliance(){let rows=state.docs.filter(d=>(state.docFilter==='All'||d.status===state.docFilter)&&(state.docType==='All'||d.type===state.docType)&&(state.docInstitution==='All'||d.institution===state.docInstitution));return `${head('Evidence & validity','Compliance & documents','Spot missing evidence and expiring records before they delay approval.',`<button class="button" data-modal="undertaking">Submit undertaking ${icon('plus',15)}</button>`)}<div class="metric-grid">${metric('Valid',state.docs.filter(d=>d.status==='Valid').length,'Current records','check')}${metric('Expiring soon',state.docs.filter(d=>d.status==='Expiring soon').length,'Renewal recommended','clock','warn')}${metric('Expired or missing',state.docs.filter(d=>['Expired','Missing'].includes(d.status)).length,'Requires action','alert','danger')}</div><div class="toolbar"><div class="field"><label for="doc-urgency">Urgency</label><select id="doc-urgency">${['All','Valid','Expiring soon','Expired','Missing','Pending verification'].map(x=>`<option ${state.docFilter===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label for="doc-type">Document type</label><select id="doc-type">${['All','Safety','Infrastructure','Faculty','Undertaking'].map(x=>`<option ${state.docType===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field" style="min-width:245px"><label for="doc-institution">Institution</label><select id="doc-institution"><option>All</option>${[...new Set(state.docs.map(d=>d.institution))].map(x=>`<option ${state.docInstitution===x?'selected':''}>${escapeHTML(x)}</option>`).join('')}</select></div></div><section class="card">${rows.length?`<div class="table-wrap"><table class="table"><thead><tr><th>Document</th><th>Institution</th><th>Type</th><th>Expiry</th><th>State</th><th>Action</th></tr></thead><tbody>${rows.map(d=>`<tr><td><span class="institution">${escapeHTML(d.name)}</span><span class="sub mono">${d.id}</span></td><td>${escapeHTML(d.institution)}</td><td>${d.type}</td><td>${fmt(d.expiry)}</td><td>${badge(d.status)}</td><td><button class="button ghost" data-modal="document" data-id="${d.id}">${d.status==='Pending verification'?'Verify':'Renew / update'}</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><h3>No documents match these filters</h3><p>Change the urgency, type, or institution to see more records.</p></div>`}</section>`}
    function notifications(){const rows=state.notes.filter(n=>state.noteFilter==='All'||(state.noteFilter==='Unread'?!n.read:n.kind===state.noteFilter));return `${head('Your attention','Notifications','Deadline reminders, deficiency alerts, EVC updates, and escalations in one place.',`<button class="button secondary" data-action="mark-all-read" ${state.notes.some(n=>!n.read)?'':'disabled'}>Mark all read</button>`)}<div class="detail-grid"><section class="card"><div class="card-pad" style="padding-bottom:12px"><div class="section-title"><h2>Inbox</h2><div class="field"><label for="note-filter">Show</label><select id="note-filter">${['All','Unread','Deadline reminder','Deficiency alert','EVC reminder','Escalation'].map(x=>`<option ${state.noteFilter===x?'selected':''}>${x}</option>`).join('')}</select></div></div></div>${rows.length?rows.map(n=>`<div class="notification ${n.read?'':'unread'}"><span class="note-icon">${icon(n.kind==='EVC reminder'?'calendar':n.kind==='Deficiency alert'?'alert':'bell',17)}</span><div class="od-fill"><div class="micro muted">${n.kind} · ${n.time}</div><h3>${escapeHTML(n.title)} ${n.read?'':'<span class="badge blue">New</span>'}</h3><p>${escapeHTML(n.body)}</p><button class="button ghost" data-open-app="${n.app}" style="padding-left:0;margin-top:5px">Open application ${icon('chevron',13)}</button></div><div class="note-actions"><button class="button secondary" data-action="toggle-note" data-id="${n.id}">${n.read?'Mark unread':'Mark read'}</button></div></div>`).join(''):`<div class="empty"><h3>All caught up</h3><p>No notifications match this view. Try another category.</p></div>`}</section><section class="card card-pad"><div class="section-title"><h2>Preferences</h2></div><p class="small muted" style="margin-bottom:12px">Choose which reminders appear in your workspace.</p>${[['deadlines','Deadline reminders'],['deficiencies','Deficiency alerts'],['evcs','EVC reminders'],['escalations','Escalations']].map(([k,l])=>`<label class="switch-row"><span>${l}</span><input type="checkbox" data-pref="${k}" ${state.preferences[k]?'checked':''} aria-label="${l}"></label>`).join('')}</section></div>`}
    function audit(){const rows=state.audit.filter(e=>(state.auditType==='All'||e.action===state.auditType)&&(!state.auditQ||(e.actor+' '+e.action+' '+e.app+' '+e.reason).toLowerCase().includes(state.auditQ.toLowerCase())));return `${head('Traceable decisions','Audit history','A readable, append-only account of what changed, who changed it, and why.',`<button class="button secondary" data-action="export-audit">Export visible events ${icon('download',15)}</button>`)}<div class="toolbar"><div class="field search"><label for="audit-search">Search audit events</label><input id="audit-search" type="search" placeholder="Actor, application ID, action, reason" value="${escapeHTML(state.auditQ)}"></div><div class="field"><label for="audit-type">Action</label><select id="audit-type"><option>All</option>${[...new Set(state.audit.map(e=>e.action))].map(x=>`<option ${state.auditType===x?'selected':''}>${escapeHTML(x)}</option>`).join('')}</select></div></div><section class="card card-pad"><div class="section-title"><div><h2>Event timeline</h2><p class="muted">Newest first · ${rows.length} events</p></div><span class="badge gray">Append-only demo log</span></div>${rows.length?rows.map(e=>`<article class="audit-event"><div class="audit-date">${escapeHTML(e.at)}</div><div class="audit-main"><strong>${escapeHTML(e.action)}</strong><p>${escapeHTML(e.actor)} · <button class="link-row" data-open-app="${e.app}" style="background:none;color:var(--accent-active);padding:0;font-size:13px">${e.app}</button></p><div class="state-change"><span class="state-pill">${escapeHTML(e.before)}</span>${icon('chevron',12)}<span class="state-pill">${escapeHTML(e.after)}</span></div><p>Reason: ${escapeHTML(e.reason)}</p></div></article>`).join(''):`<div class="empty"><h3>No matching events</h3><p>Try a broader search or select another action.</p></div>`}</section>`}
    function view(){return ({overview,applications:applicationList,detail:details,evc,compliance,notifications,audit})[state.page]();}
    function render(focus=false){$('#app').innerHTML=shell();if(focus){$('#main-content h1')?.setAttribute('tabindex','-1');$('#main-content h1')?.focus({preventScroll:true});window.scrollTo({top:0,behavior:'instant'})}renderModal()}
    function toast(msg,error=false){const t=$('#toast');t.innerHTML=`<div class="toast ${error?'error':''}">${escapeHTML(msg)}</div>`;clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.innerHTML='',3600)}
    function addAudit(action,appId,before,after,reason){state.audit.unshift({id:Date.now(),at:new Date().toLocaleString('en-IN',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}),actor:'Ananya Rao',action,app:appId,before,after,reason})}
    function go(page){state.page=page;state.error=false;state.load=false;location.hash=page==='detail'?`application/${state.selected}`:page;render(true)}
    function openApp(id){state.selected=id;go('detail')}
    function showModal(kind,id=''){state.modal={kind,id,error:''};renderModal();$('#dialog-close')?.focus()}
    function closeModal(){state.modal=null;renderModal()}
    function modalFields(m){const a=app(state.selected);const e=state.evcs.find(x=>x.id===m.id);const d=state.docs.find(x=>x.id===m.id);switch(m.kind){case'deficiency':return {title:'Return for deficiency',intro:`Record what ${a.name} must correct. This will assign the next action to the institution.`,fields:`<div class="field"><label for="modal-reason">Deficiency details <span aria-hidden="true">*</span></label><textarea id="modal-reason" name="reason" required placeholder="Describe the missing or incorrect evidence"></textarea></div>`,submit:'Record deficiency'};case'advance':return {title:'Move to next stage',intro:`Move ${a.name} from ${stages[a.stage]} to ${stages[a.stage+1]}. The change will be recorded in the audit history.`,fields:`<div class="field"><label for="modal-reason">Decision reason <span aria-hidden="true">*</span></label><textarea id="modal-reason" name="reason" required placeholder="Summarise the review outcome"></textarea></div>`,submit:'Confirm stage change'};case'reminder':return {title:'Send deadline reminder',intro:`Notify the current owner of ${a.name} about the ${fmt(a.deadline)} deadline.`,fields:'',submit:'Send reminder'};case'evc-actions':return {title:`Manage ${e.id}`,intro:`${app(e.app)?.name} · ${fmt(e.date)} · ${e.status}`,fields:`<div class="od-stack" style="--od-gap:8px"><button type="button" class="button secondary" data-modal="reschedule" data-id="${e.id}">Reschedule inspection</button><button type="button" class="button secondary" data-modal="assign" data-id="${e.id}">Assign committee</button><button type="button" class="button secondary" data-modal="evidence" data-id="${e.id}">${e.evidence==='Not uploaded'?'Upload evidence':'View evidence'}</button><button type="button" class="button secondary" data-modal="complete-evc" data-id="${e.id}" ${e.status==='Completed'?'disabled':''}>Mark completed</button></div>`,submit:null};case'reschedule':return {title:'Reschedule inspection',intro:`Choose a new date for ${app(e.app)?.name}.`,fields:`<div class="field"><label for="modal-date">New inspection date</label><input id="modal-date" name="date" type="date" value="${e.date}" min="2026-10-25" required></div>`,submit:'Save schedule'};case'assign':return {title:'Assign committee',intro:`Set committee members for ${app(e.app)?.name}.`,fields:`<div class="field"><label for="modal-members">Committee members</label><input id="modal-members" name="members" value="${escapeHTML(e.members==='Assignment pending'?'':e.members)}" required placeholder="Names separated by commas"></div>`,submit:'Save assignment'};case'evidence':return {title:'Inspection evidence',intro:`${app(e.app)?.name} · ${e.evidence}`,fields:`<div class="field"><label for="modal-file">${e.evidence==='Not uploaded'?'Upload inspection report':'Replace inspection report'}</label><input id="modal-file" name="file" type="file" accept=".pdf,.jpg,.jpeg,.png" required></div><p class="small muted">The prototype stores the filename only. File contents are not uploaded.</p>`,submit:'Attach evidence'};case'complete-evc':return {title:'Complete inspection',intro:`Confirm the committee has completed ${app(e.app)?.name}'s inspection.`,fields:`<div class="field"><label for="modal-reason">Completion note</label><textarea id="modal-reason" name="reason" required placeholder="Summarise the inspection outcome"></textarea></div>`,submit:'Mark completed'};case'document':return {title:d.status==='Pending verification'?'Verify undertaking':'Renew or update document',intro:`${d.name} · ${d.institution}`,fields:d.status==='Pending verification'?`<div class="field"><label for="modal-reason">Verification note</label><textarea id="modal-reason" name="reason" required placeholder="Record the verification basis"></textarea></div>`:`<div class="field"><label for="modal-date">New expiry date</label><input id="modal-date" name="date" type="date" min="2026-10-25" required></div><div class="field"><label for="modal-file">Replacement evidence</label><input id="modal-file" name="file" type="file" accept=".pdf,.jpg,.jpeg,.png" required></div><p class="small muted">The prototype stores the filename only.</p>`,submit:d.status==='Pending verification'?'Verify undertaking':'Save renewal'};case'undertaking':return {title:'Submit undertaking',intro:'Add a new undertaking to the compliance inventory for verification.',fields:`<div class="field"><label for="modal-institution">Institution</label><select id="modal-institution" name="institution" required><option value="">Select institution</option>${state.apps.map(a=>`<option>${escapeHTML(a.name)}</option>`).join('')}</select></div><div class="field"><label for="modal-name">Undertaking title</label><input id="modal-name" name="name" required placeholder="e.g. Faculty ratio undertaking"></div><div class="field"><label for="modal-date">Expiry date</label><input id="modal-date" name="date" type="date" min="2026-10-25" required></div><div class="field"><label for="modal-file">Signed document</label><input id="modal-file" name="file" type="file" accept=".pdf,.jpg,.jpeg,.png" required></div><p class="small muted">The prototype stores the filename only.</p>`,submit:'Submit for verification'};default:return {title:'Action',intro:'',fields:'',submit:null}}}
    function renderModal(){const target=$('#overlay');if(!state.modal){target.innerHTML='';return}const m=state.modal,v=modalFields(m);target.innerHTML=`<div class="dialog-backdrop" data-backdrop><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><div class="dialog-head"><div><h2 id="dialog-title">${v.title}</h2><p class="small muted" style="margin-top:7px">${escapeHTML(v.intro)}</p></div><button class="icon-button" id="dialog-close" data-action="close-modal" aria-label="Close dialog">${icon('x')}</button></div><form id="action-form" novalidate>${v.fields}${m.error?`<p class="error-text" role="alert">${escapeHTML(m.error)}</p>`:''}<div class="dialog-actions"><button type="button" class="button secondary" data-action="close-modal">Cancel</button>${v.submit?`<button type="submit" class="button" ${state.busy?'disabled':''}>${state.busy?'Working…':v.submit}</button>`:''}</div></form></div></div>`}
    function performAction(form){const m=state.modal;if(!m)return;const data=new FormData(form);if(!form.checkValidity()){m.error='Complete all required fields before continuing.';renderModal();$('#action-form :invalid')?.focus();return}state.busy=true;renderModal();setTimeout(()=>{try{const kind=m.kind;const a=app(state.selected);const e=state.evcs.find(x=>x.id===m.id);const d=state.docs.find(x=>x.id===m.id);const reason=String(data.get('reason')||'').trim();if(['deficiency','advance','complete-evc','document'].includes(kind)&&kind!=='document'&&!reason)throw Error('Enter a reason to continue.');if(kind==='deficiency'){const before=a.status;a.deficiency=reason;a.status='Deficiency raised';a.owner='Institution';addAudit('Raised deficiency',a.id,before,a.status,reason);toast('Deficiency recorded and assigned to the institution.')}else if(kind==='advance'){const before=stages[a.stage];a.stage=Math.min(5,a.stage+1);a.status=['Submitted','Pending scrutiny','Re-scrutiny','EVC scheduled','Decision pending','Approved'][a.stage];a.owner=['Scrutiny desk','Ananya Rao','Scrutiny officer','EVC committee','Executive committee','Institution'][a.stage];addAudit('Moved to next stage',a.id,before,stages[a.stage],reason);toast(`Application moved to ${stages[a.stage]}.`)}else if(kind==='reminder'){state.notes.unshift({id:'N-'+Date.now(),kind:'Deadline reminder',title:'Reminder sent',body:`${a.name}: ${fmt(a.deadline)} deadline reminder sent to ${a.owner}.`,time:'Just now',read:true,app:a.id});addAudit('Sent deadline reminder',a.id,'Not sent','Sent',`Reminder sent to ${a.owner}.`);toast('Reminder sent.')}else if(kind==='reschedule'){const old=e.date;e.date=String(data.get('date'));e.status='Scheduled';addAudit('Rescheduled EVC',e.app,fmt(old),fmt(e.date),'Inspection date updated by coordinator.');toast('Inspection rescheduled.')}else if(kind==='assign'){const old=e.members;e.members=String(data.get('members')).trim();e.status='Scheduled';addAudit('Assigned EVC committee',e.app,old,e.members,'Committee assignment updated.');toast('Committee assignment saved.')}else if(kind==='evidence'){const filename=data.get('file')?.name;if(!filename)throw Error('Choose a report to attach.');e.evidence=filename;addAudit('Attached EVC evidence',e.app,'Not uploaded',filename,'Inspection evidence filename recorded in demo.');toast('Evidence attached.')}else if(kind==='complete-evc'){if(e.evidence==='Not uploaded')throw Error('Attach inspection evidence before completing the EVC.');e.status='Completed';addAudit('Completed EVC',e.app,'Scheduled','Completed',reason);toast('Inspection marked complete.')}else if(kind==='document'){if(d.status==='Pending verification'){if(!reason)throw Error('Enter a verification note.');const old=d.status;d.status='Verified';addAudit('Verified undertaking',state.apps.find(x=>x.name===d.institution)?.id||'',old,'Verified',reason);toast('Undertaking verified.')}else{const filename=data.get('file')?.name;if(!filename)throw Error('Choose replacement evidence.');const old=d.status;d.expiry=String(data.get('date'));d.status='Valid';addAudit('Renewed document',state.apps.find(x=>x.name===d.institution)?.id||'',old,'Valid',`${d.name} renewed; ${filename}.`);toast('Document renewal recorded.')}}else if(kind==='undertaking'){const institution=String(data.get('institution'));const name=String(data.get('name')).trim();const filename=data.get('file')?.name;if(!institution||!name||!filename)throw Error('Complete the undertaking fields.');state.docs.unshift({id:'D-'+Date.now(),name,institution,type:'Undertaking',expiry:String(data.get('date')),status:'Pending verification'});addAudit('Submitted undertaking',state.apps.find(x=>x.name===institution)?.id||'','Missing','Pending verification',`${name}; ${filename}.`);toast('Undertaking submitted for verification.')}state.busy=false;closeModal();render()}catch(err){state.busy=false;m.error=err.message;renderModal();toast(err.message,true)}},650)}
    document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b){if(e.target.matches('[data-backdrop]'))closeModal();return}if(b.dataset.page){go(b.dataset.page);return}if(b.dataset.openApp){openApp(b.dataset.openApp);return}if(b.dataset.modal){showModal(b.dataset.modal,b.dataset.id||'');return}if(b.dataset.view){state.filters.view=b.dataset.view;state.filters.page=1;render();return}if(b.dataset.evcView){state.evcView=b.dataset.evcView;render();return}const action=b.dataset.action,id=b.dataset.id;if(!action)return;if(action==='close-modal')closeModal();if(action==='prev-page'){state.filters.page--;render()}if(action==='next-page'){state.filters.page++;render()}if(action==='clear-filters'){state.filters={q:'',status:'All',sort:'Deadline',page:1,view:'All applications'};render()}if(action==='bulk-reminder'){const ids=[...state.selectedRows];ids.forEach(appId=>addAudit('Sent bulk reminder',appId,'Not sent','Sent','Reminder sent from selected applications.'));state.selectedRows.clear();toast(`Reminder sent for ${ids.length} application${ids.length===1?'':'s'}.`);render()}if(action==='toggle-note'){const n=state.notes.find(x=>x.id===id);n.read=!n.read;render()}if(action==='mark-all-read'){state.notes.forEach(n=>n.read=true);render();toast('All notifications marked read.')}if(action==='simulate-error'){state.error=true;state.load=false;render()}if(action==='retry'){state.error=false;state.load=true;render();setTimeout(()=>{state.load=false;render();toast('Applications loaded.')},700)}if(action==='simulate-loading'){state.load=true;state.error=false;render();setTimeout(()=>{state.load=false;render()},900)}if(action==='export-audit'){const rows=state.audit.filter(x=>(state.auditType==='All'||x.action===state.auditType)&&(!state.auditQ||(x.actor+' '+x.action+' '+x.app+' '+x.reason).toLowerCase().includes(state.auditQ.toLowerCase())));const csv=['Timestamp,Actor,Action,Application,Previous state,New state,Reason',...rows.map(x=>[x.at,x.actor,x.action,x.app,x.before,x.after,x.reason].map(v=>'"'+String(v).replaceAll('"','""')+'"').join(','))].join('\n');const link=document.createElement('a');link.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));link.download='aegis-audit-demo.csv';link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1000);toast('Visible audit events exported.')}});
    document.addEventListener('input',e=>{if(e.target.id==='app-search'){const pos=e.target.selectionStart;state.filters.q=e.target.value;state.filters.page=1;render();const i=$('#app-search');i.focus();i.setSelectionRange(pos,pos)}if(e.target.id==='audit-search'){const pos=e.target.selectionStart;state.auditQ=e.target.value;render();const i=$('#audit-search');i.focus();i.setSelectionRange(pos,pos)}});
    document.addEventListener('change',e=>{const t=e.target;if(t.id==='status-filter'){state.filters.status=t.value;state.filters.page=1;render()}if(t.id==='sort-filter'){state.filters.sort=t.value;render()}if(t.id==='select-all'){const shown=filteredApps().slice((state.filters.page-1)*5,state.filters.page*5);shown.forEach(a=>t.checked?state.selectedRows.add(a.id):state.selectedRows.delete(a.id));render()}if(t.classList.contains('row-check')){t.checked?state.selectedRows.add(t.value):state.selectedRows.delete(t.value);render()}if(t.id==='doc-urgency'){state.docFilter=t.value;render()}if(t.id==='doc-type'){state.docType=t.value;render()}if(t.id==='doc-institution'){state.docInstitution=t.value;render()}if(t.id==='note-filter'){state.noteFilter=t.value;render()}if(t.id==='audit-type'){state.auditType=t.value;render()}if(t.dataset.pref){state.preferences[t.dataset.pref]=t.checked;toast('Notification preferences saved.')}});
    document.addEventListener('submit',e=>{if(e.target.id==='action-form'){e.preventDefault();performAction(e.target)}});
    document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.modal)closeModal()});
    window.addEventListener('hashchange',()=>{const hash=decodeURIComponent(location.hash.slice(1));if(hash.startsWith('application/')){const id=hash.split('/')[1];if(app(id)){state.selected=id;state.page='detail'}}else if(pageTitle[hash])state.page=hash;render()});
    const initial=decodeURIComponent(location.hash.slice(1));if(initial.startsWith('application/')&&app(initial.split('/')[1])){state.selected=initial.split('/')[1];state.page='detail'}else if(pageTitle[initial])state.page=initial;render();
  </script>
</body>
